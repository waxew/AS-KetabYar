import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id "com.mikepenz.aboutlibraries.plugin.android" version "14.2.0"
}

android {
    namespace 'com.starry.myne'
    compileSdk = 36

    defaultConfig {
        // شناسه انتشار مستقل کتاب‌یار. namespace در refactor کامل تغییر می‌کند.
        applicationId "com.asteam.ketabyar"
        minSdk 26
        targetSdk 36
        versionCode 510
        versionName "5.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // نام استاندارد خروجی Release کتاب‌یار.
            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    def name = "AS-KetabYar-v${variant.versionName}.apk"
                    output.outputFileName = name
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    composeCompiler {
        enableStrongSkippingMode = true
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    androidResources {
        generateLocaleConfig true
    }

    packaging {
        resources {
            pickFirsts += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    lint {
        abortOnError true
        disable "LocalContextGetResourceValueCall"
        disable "MissingTranslation"
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
        jvmDefault.set(JvmDefaultMode.ENABLE)
    }
}

aboutLibraries {
    export {
        // Remove the "generated" timestamp to allow for reproducible builds
        excludeFields.addAll("generated")
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.05.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.material3:material3"
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.2"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.3.0"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"
    ksp "androidx.hilt:hilt-compiler:1.3.0"
    implementation "org.jsoup:jsoup:1.22.2"
    implementation "com.airbnb.android:lottie-compose:6.7.1"
    implementation "com.pierfrancescosoffritti.taptargetcompose:core:1.2.1"
    implementation("androidx.datastore:datastore-preferences:1.2.1")
    implementation "com.mikepenz:aboutlibraries-core:14.2.0"
    implementation "com.mikepenz:aboutlibraries-compose-m3:14.2.0"
    implementation "me.saket.swipe:swipe:1.3.0"
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.3.21"
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.4.5"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}